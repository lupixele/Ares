<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <%- header %>
  <style>
    /* ── Pre-auth Shell & Modern Card ── */
    .preauth-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .preauth-card {
      width: 100%;
      max-width: 440px;
      border: 1px solid var(--bs-border-color);
      border-radius: 14px;
      background: var(--bs-body-bg);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .preauth-header {
      text-align: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--bs-border-color);
      margin-bottom: 1.5rem;
    }

    .preauth-logo {
      height: 48px;
      margin-bottom: 0.75rem;
    }

    .preauth-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .preauth-topbar {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      z-index: 10;
    }

    .config-field-label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
    }
  </style>
</head>

<body id="app" v-cloak>
  <div class="preauth-topbar">
    <ThemeToggle />
  </div>

  <main role="main" class="preauth-layout">
    <div class="card preauth-card p-4">
      <header class="preauth-header">
        <img src="/images/logo-apollo-45.png" class="preauth-logo" alt="Ares logo">
        <h1 class="preauth-title mb-0">
          {{ $t('welcome.greeting') }}
        </h1>
      </header>

      <form @submit.prevent="login">
        <div class="mb-3">
          <label for="usernameInput" class="form-label config-field-label">{{ $t('_common.username') }}</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user" aria-hidden="true"></i></span>
            <input type="text" class="form-control" id="usernameInput" autocomplete="username"
              v-model="passwordData.username" required autofocus />
          </div>
        </div>

        <div class="mb-3">
          <label for="passwordInput" class="form-label config-field-label">{{ $t('_common.password') }}</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock" aria-hidden="true"></i></span>
            <input type="password" class="form-control" id="passwordInput" autocomplete="current-password"
              v-model="passwordData.password" required />
          </div>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="savePassword" v-model="savePassword"/>
          <label for="savePassword" class="form-check-label">{{ $t('login.save_password') }}</label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mb-3" :disabled="loading">
          <span v-if="loading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          <i v-else class="fas fa-sign-in-alt me-1" aria-hidden="true"></i>
          {{ $t('welcome.login') }}
        </button>

        <div class="alert alert-danger d-flex align-items-center mb-0" v-if="error">
          <i class="fas fa-exclamation-triangle me-2" aria-hidden="true"></i>
          <div><b>{{ $t('_common.error') }}</b> {{error}}</div>
        </div>

        <div class="alert alert-success d-flex align-items-center mb-0" v-if="success">
          <i class="fas fa-check-circle me-2" aria-hidden="true"></i>
          <div><b>{{ $t('_common.success') }}</b> {{ $t('welcome.login_success') }}</div>
        </div>
      </form>
    </div>
  </main>
</body>

<script type="module">
  import { createApp, ref } from 'vue'
  import { initApp } from './init'
  import ThemeToggle from './ThemeToggle.vue'

  let app = createApp({
    components: {
      ThemeToggle
    },
    data() {
      const error = ref(null)
      const success = ref(false)
      const loading = ref(false)
      const savePassword = ref(false)

      const data = {
        error,
        success,
        loading,
        savePassword,
        passwordData: {
          username: '',
          password: ''
        }
      }

      let savedPasswordStr = null
      try {
        savedPasswordStr = localStorage.getItem('login')
      } catch (e) {
        console.error('Reading localStorage failed!', e)
      }

      if (savedPasswordStr) {
        try {
          const { username, password } = JSON.parse(savedPasswordStr);
          savePassword.value = true;
          data.passwordData = {
            username,
            password
          }
        } catch (e) {
          console.error('Reading saved password failed!', e);
        }
      }

      return data
    },
    methods: {
      login() {
        this.error = null;
        this.loading = true;
        if (!this.savePassword) {
          try {
            localStorage.removeItem('login')
          } catch (e) {
            console.error('Removing login from localStorage failed!', e)
          }
        }
        fetch("./api/login", {
          headers: {
            'Content-Type': 'application/json'
          },
          method: 'POST',
          body: JSON.stringify(this.passwordData),
        }).then((res) => {
          this.loading = false;
          if (res.status === 200) {
            this.success = true;
            if (this.savePassword) {
              try {
                localStorage.setItem('login', JSON.stringify(this.passwordData));
              } catch (e) {
                console.error('Saving login to localStorage failed!', e)
              }
            }
            const url = new URL(window.location);
            const redirectUrl = url.searchParams.get('redir');
            const hash = url.hash;
            if (redirectUrl && redirectUrl.startsWith('.')) {
              location.href = redirectUrl + hash;
            } else {
              location.href = './' + hash;
            }
          } else {
            if (res.status === 401) {
              throw this.$t('login.auth_failed');
            } else {
              throw this.$t('_common.error') + ` ${res.status}`;
            }
          }
        }).catch((e) => {
          this.loading = false;
          this.error = e;
        });
      }
    }
  });

  initApp(app);
</script>
</html>
